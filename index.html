<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Multi-Chain Gas Tracker</title>
    
    <!-- Web3 Libraries (Read-Only) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #e0e0e0; text-align: center; padding: 20px; }
        h1 { color: #fff; }
        p.subtitle { color: #aaa; margin-bottom: 30px; }
        
        .container { max-width: 1000px; margin: 0 auto; background-color: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #333; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid #444; text-align: left; }
        th { background-color: #444; color: #fff; font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        
        .arc-row { background-color: rgba(0, 255, 127, 0.1); font-weight: bold; color: #00ff7f; }
        .token-price { font-size: 0.85em; color: #aaa; }
        .stale { color: #ff6b6b; font-size: 0.8em; }

        #refresh-status { margin-top: 15px; font-size: 0.9em; color: #888; }
        .loader { color: #00ff7f; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Arc Multi-Chain Gas Tracker</h1>
    <p class="subtitle">Real-time comparison of transaction fees (Read-Only / No Private Keys)</p>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Network & Native Token</th>
                    <th>Token Price (USD)</th>
                    <th>Raw Gas Price</th>
                    <th>Est. Transfer Cost (USD)</th>
                </tr>
            </thead>
            <tbody id="gas-table-body">
                <!-- Rows generated by JS -->
            </tbody>
        </table>
        <p id="refresh-status">Updating in <span id="countdown">300</span>s... <span id="loader" class="loader" style="display:none;">(Fetching...)</span></p>
    </div>

    <script>
        // --- CONFIGURATION (Public RPC URLs) ---
        const ARC_RPC_URL = "https://rpc.testnet.arc.network";
        const ETH_SEPOLIA_RPC_URL = "https://ethereum-sepolia-rpc.publicnode.com";
        const SOLANA_DEVNET_RPC_URL = "https://api.devnet.solana.com";
        const POLYGON_AMOY_RPC_URL = "https://polygon-amoy.drpc.org";
        const ARBITRUM_SEPOLIA_RPC_URL = "https://arbitrum-sepolia.drpc.org";
        const COINGECKO_API_URL = "https://api.coingecko.com/api/v3/simple/price?ids=ethereum,solana,matic-network&vs_currencies=usd";

        // --- Transaction Constants ---
        const EVM_TRANSFER_GAS_UNITS = 21000; 
        const SOLANA_TRANSFER_FEE_LAMPORTS = 5000; 

        // --- State Variables ---
        let providers = {};
        let solanaConnection;
        let countdownValue = 300; // 5 minutes
        let countdownInterval;

        // --- Initialize Connections ---
        function initProviders() {
            providers.arc = new ethers.JsonRpcProvider(ARC_RPC_URL);
            providers.eth = new ethers.JsonRpcProvider(ETH_SEPOLIA_RPC_URL);
            providers.polygon = new ethers.JsonRpcProvider(POLYGON_AMOY_RPC_URL);
            providers.arbitrum = new ethers.JsonRpcProvider(ARBITRUM_SEPOLIA_RPC_URL);
            solanaConnection = new solanaWeb3.Connection(SOLANA_DEVNET_RPC_URL);
        }

        // Helper function: Returns { gasPrice: null } if the RPC fails, preventing a crash
        async function safeGetFeeData(provider, name) {
            try {
                return await provider.getFeeData();
            } catch (error) {
                console.warn(`RPC Error for ${name} (Node might be down or rate-limited). Row will be hidden.`);
                return { gasPrice: null }; 
            }
        }

        // --- Main Logic ---
        async function refreshGasData() {
            document.getElementById('loader').style.display = 'inline';
            const tableBody = document.getElementById('gas-table-body');
            tableBody.innerHTML = ''; 

            try {
                // 1. Fetch Token Prices
                let tokenPrices = {};
                try {
                    const pricesResponse = await fetch(COINGECKO_API_URL);
                    if (pricesResponse.ok) tokenPrices = await pricesResponse.json();
                } catch (e) { console.warn("CoinGecko rate-limited."); }

                const prices = {
                    eth: tokenPrices?.ethereum?.usd || 0,
                    sol: tokenPrices?.solana?.usd || 0,
                    matic: tokenPrices?.['matic-network']?.usd || 0,
                    usdc: 1.00 
                };

                // 2. Fetch On-Chain Data concurrently
                const [arcFee, ethFee, polygonFee, arbitrumFee] = await Promise.all([
                    safeGetFeeData(providers.arc, "Arc"),
                    safeGetFeeData(providers.eth, "Ethereum"),
                    safeGetFeeData(providers.polygon, "Polygon"),
                    safeGetFeeData(providers.arbitrum, "Arbitrum")
                ]);

                // 3. Update UI CONDITIIONALLY (Only display the row if gasPrice is NOT null)

                // A. ARC NETWORK
                if (arcFee.gasPrice !== null) {
                    const arcUsdcCost = (Number(arcFee.gasPrice) * EVM_TRANSFER_GAS_UNITS) / 1e15;
                    addTableRow(tableBody, "Arc Network (USDC Gas)", prices.usdc, `${ethers.formatUnits(arcFee.gasPrice, 'gwei')} Gwei`, `$${arcUsdcCost.toFixed(6)} USDC`, true);
                }

                // B. ETHEREUM SEPOLIA
                if (ethFee.gasPrice !== null) {
                    const ethUsdCost = ((Number(ethFee.gasPrice) * EVM_TRANSFER_GAS_UNITS) / 1e18) * prices.eth;
                    addTableRow(tableBody, "Ethereum Sepolia (ETH)", prices.eth, `${ethers.formatUnits(ethFee.gasPrice, 'gwei')} Gwei`, `$${ethUsdCost.toFixed(4)}`);
                }

                // C. ARBITRUM SEPOLIA
                if (arbitrumFee.gasPrice !== null) {
                    const arbUsdCost = ((Number(arbitrumFee.gasPrice) * EVM_TRANSFER_GAS_UNITS) / 1e18) * prices.eth;
                    addTableRow(tableBody, "Arbitrum Sepolia (ETH L2)", prices.eth, `${ethers.formatUnits(arbitrumFee.gasPrice, 'gwei')} Gwei`, `$${arbUsdCost.toFixed(6)}`);
                }

                // D. POLYGON AMOY
                if (polygonFee.gasPrice !== null) {
                    const polyUsdCost = ((Number(polygonFee.gasPrice) * EVM_TRANSFER_GAS_UNITS) / 1e18) * prices.matic;
                    addTableRow(tableBody, "Polygon Amoy (MATIC)", prices.matic, `${ethers.formatUnits(polygonFee.gasPrice, 'gwei')} Gwei`, `$${polyUsdCost.toFixed(6)}`);
                }

                // E. SOLANA DEVNET (Always displays as it doesn't rely on EVM fee fetching here)
                const solUsdCost = (SOLANA_TRANSFER_FEE_LAMPORTS / 1e9) * prices.sol;
                addTableRow(tableBody, "Solana Devnet (SOL)", prices.sol, `${SOLANA_TRANSFER_FEE_LAMPORTS} Lamports`, `$${solUsdCost.toFixed(6)}`);

                resetCountdown();
            } catch (error) {
                console.error("Critical rendering error:", error);
                tableBody.innerHTML = `<tr><td colspan="4" class="stale">A critical error occurred. Please refresh the page.</td></tr>`;
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }

        // --- Utilities ---
        function addTableRow(body, chain, price, rawGas, usdCost, isArc = false) {
            const row = document.createElement('tr');
            if (isArc) row.classList.add('arc-row'); 
            
            row.innerHTML = `
                <td>${chain}</td>
                <td>$${(price || 0).toFixed(2)} <span class="token-price">${isArc ? '' : '(Live)'}</span></td>
                <td>${rawGas}</td>
                <td>${usdCost}</td>
            `;
            body.appendChild(row);
        }

        function resetCountdown() {
            clearInterval(countdownInterval);
            countdownValue = 300; 
            document.getElementById('countdown').innerText = countdownValue;
            countdownInterval = setInterval(() => {
                countdownValue--;
                document.getElementById('countdown').innerText = countdownValue;
                if (countdownValue <= 0) {
                    refreshGasData();
                }
            }, 1000);
        }

        // --- Start ---
        initProviders(); 
        refreshGasData(); 

    </script>
</body>
</html>
